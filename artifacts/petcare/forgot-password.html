<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password — PetWell</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body style="background: hsl(40 40% 92% / 0.3);">
    <div class="app-shell" style="align-items:center; justify-content:center; padding: 1rem;">
      <a href="index.html" class="brand mb-8" style="margin-top: 2rem;">
        <div class="brand-logo" style="width:2.5rem; height:2.5rem; font-size:1.125rem;">PW</div>
        <span class="text-2xl font-bold tracking-tight text-primary">PetWell</span>
      </a>

      <div class="card shadow-lg w-full" style="max-width: 28rem; border: 0; border-radius: 1rem;">
        <div id="form-state">
          <div class="card-header text-center" style="padding: 2rem 1.5rem 0.5rem;">
            <h2 class="text-2xl">Reset password</h2>
            <p class="card-description">Enter your email address and we'll send you a link to reset your password.</p>
          </div>
          <div class="card-content">
            <form id="forgot-form" class="space-y-4">
              <div>
                <label class="label" for="email">Email</label>
                <input class="input input-soft" id="email" type="email" placeholder="jane@example.com" required />
              </div>
              <button type="submit" class="btn btn-primary btn-h12 w-full" style="border-radius: 0.75rem; margin-top: 0.5rem;">Send reset link</button>
            </form>
          </div>
          <div class="card-footer flex justify-center" style="padding-bottom: 2rem;">
            <a href="login.html" class="flex items-center gap-2 text-sm font-medium text-muted-foreground">
              <i data-lucide="arrow-left" class="i-4"></i>
              Back to login
            </a>
          </div>
        </div>

        <div id="success-state" style="display:none; padding: 2rem; text-align: center;">
          <div class="mx-auto mb-6" style="width:4rem; height:4rem; border-radius:50%; background: hsl(160 47% 45% / 0.1); color: var(--primary); display:flex; align-items:center; justify-content:center;">
            <i data-lucide="check-circle-2" class="i-8"></i>
          </div>
          <h2 class="text-2xl mb-2">Check your email</h2>
          <p class="text-muted-foreground mb-6">We've sent a password reset link to your email address.</p>
          <a href="login.html" class="btn btn-outline btn-h12 w-full" style="border-radius: 0.75rem;">Return to login</a>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>
      lucide.createIcons();
      document.getElementById("forgot-form").addEventListener("submit", (e) => {
        e.preventDefault();
        document.getElementById("form-state").style.display = "none";
        document.getElementById("success-state").style.display = "block";
        lucide.createIcons();
      });
    </script>
  </body>
</html>
