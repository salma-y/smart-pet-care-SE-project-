<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search — PetWell</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <div id="topnav-slot"></div>
      <div class="main-area">
        <div id="sidebar-slot"></div>
        <div class="page-content">
          <div class="p-6 md:p-8 mx-auto space-y-6" style="max-width: 64rem; width: 100%;">
            <div class="page-header">
              <div>
                <h1>Global Search</h1>
                <p>Function #44 — search pets, vets, providers, and products from one place.</p>
              </div>
            </div>

            <div class="filters-bar">
              <div class="search-input" style="flex:1;">
                <i data-lucide="search"></i>
                <input class="input search-large" id="q" placeholder="Try 'Mochi', 'Dr. Chen', 'Cosequin'..." autofocus />
              </div>
            </div>

            <div class="tabs-list" style="grid-template-columns: repeat(5, 1fr);">
              <button class="tab active" data-tab="all">All</button>
              <button class="tab" data-tab="pets">Pets</button>
              <button class="tab" data-tab="vets">Vets</button>
              <button class="tab" data-tab="providers">Providers</button>
              <button class="tab" data-tab="products">Products</button>
            </div>

            <div id="results"></div>
          </div>
        </div>
      </div>
      <div id="footer-slot"></div>
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>window.PetWellPage = { id: "search" };</script>
    <script src="/js/data.js"></script>
    <script src="/js/vet-data.js"></script>
    <script src="/js/notif-data.js"></script>
    <script src="/js/shell.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        let activeTab = "all";
        const sectionTitle = { pets: "Pets", vets: "Veterinarians", providers: "Service Providers", products: "Products" };

        const render = () => {
          const q = document.getElementById("q").value;
          const results = window.NotifData.search(q);
          const totalCount = Object.values(results).reduce((a, b) => a + b.length, 0);
          if (!q) {
            document.getElementById("results").innerHTML = `
              <div class="empty-state">
                <div class="empty-state-icon"><i data-lucide="search" class="i-5"></i></div>
                <p>Type to start searching across PetWell.</p>
                <div class="chip-group" style="margin-top:1rem; justify-content:center;">
                  <button class="chip" data-suggest="Mochi">Mochi</button>
                  <button class="chip" data-suggest="Dr. Chen">Dr. Chen</button>
                  <button class="chip" data-suggest="Hannah">Hannah</button>
                  <button class="chip" data-suggest="Apoquel">Apoquel</button>
                </div>
              </div>
            `;
            if (window.renderIcons) window.renderIcons();
            return;
          }
          if (totalCount === 0) {
            document.getElementById("results").innerHTML = `
              <div class="empty-state">
                <div class="empty-state-icon"><i data-lucide="search-x" class="i-5"></i></div>
                <p>No results for "<strong>${q}</strong>"</p>
                <p class="text-sm text-muted-foreground">Try a shorter query or check the spelling.</p>
              </div>
            `;
            if (window.renderIcons) window.renderIcons();
            return;
          }
          let html = "";
          const renderSection = (title, items) => `
            <div class="card card-soft">
              <div class="card-header flex items-center justify-between">
                <h3 class="text-lg font-semibold">${title}</h3>
                <span class="badge badge-primary">${items.length}</span>
              </div>
              <div class="card-content">
                <div class="search-result-list">
                  ${items.map(it => `
                    <a href="${it.href}" class="search-result">
                      <div class="search-result-icon"><i data-lucide="${it.icon}" class="i-4"></i></div>
                      <div>
                        <strong style="font-size:0.875rem;">${it.name}</strong>
                        <p class="text-xs text-muted-foreground">${it.subtitle}</p>
                      </div>
                      <i data-lucide="arrow-right" class="i-4 text-muted-foreground"></i>
                    </a>
                  `).join("")}
                </div>
              </div>
            </div>
          `;
          ["pets", "vets", "providers", "products"].forEach(k => {
            if (activeTab === "all" || activeTab === k) {
              if (results[k].length) html += renderSection(sectionTitle[k], results[k]);
            }
          });
          document.getElementById("results").innerHTML = html || `<div class="empty-state"><div class="empty-state-icon"><i data-lucide="search" class="i-5"></i></div><p>No matches in this category.</p></div>`;
          if (window.renderIcons) window.renderIcons();
        };
        render();
        document.getElementById("q").addEventListener("input", render);
        document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
          t.classList.add("active");
          activeTab = t.dataset.tab;
          render();
        }));
        document.addEventListener("click", (e) => {
          const t = e.target.closest("[data-suggest]");
          if (t) { document.getElementById("q").value = t.dataset.suggest; render(); }
        });
      });
    </script>
  </body>
</html>
