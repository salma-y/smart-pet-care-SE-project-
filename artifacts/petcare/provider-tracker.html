<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Active Session Tracker — PetWell</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <div id="topnav-slot"></div>
      <div class="main-area">
        <div id="sidebar-slot"></div>
        <div class="page-content">
          <div class="p-6 md:p-8 mx-auto space-y-6" style="max-width: 80rem; width: 100%;">
            <div class="page-header">
              <div>
                <h1 id="title">Active Session — Bella</h1>
                <p id="subtitle">Group Walk · Started 11:00 AM</p>
              </div>
              <div class="flex items-center gap-3">
                <span class="countdown-pill" id="timer"><i data-lucide="timer" class="i-4"></i> 00:00</span>
                <button class="btn btn-destructive btn-sm" id="end-btn"><i data-lucide="square" class="i-4"></i> End Session</button>
              </div>
            </div>

            <div class="grid grid-2" style="gap:1.5rem;">
              <div class="card card-soft">
                <div class="card-header"><h3 class="text-lg font-semibold">Live GPS</h3></div>
                <div class="card-content">
                  <div class="map-canvas" style="height: 24rem;">
                    <svg viewBox="0 0 600 360" preserveAspectRatio="xMidYMid slice">
                      <g class="map-grid">
                        <line x1="0" y1="60" x2="600" y2="60"/><line x1="0" y1="120" x2="600" y2="120"/>
                        <line x1="0" y1="180" x2="600" y2="180"/><line x1="0" y1="240" x2="600" y2="240"/>
                      </g>
                      <path class="map-road-edge" d="M 50 320 Q 150 300 240 240 Q 320 200 380 140 Q 440 90 560 80"/>
                      <path class="map-road" d="M 50 320 Q 150 300 240 240 Q 320 200 380 140 Q 440 90 560 80"/>
                      <path id="walked" d="M 50 320 Q 100 310 130 280" fill="none" stroke="#16a34a" stroke-width="4" stroke-dasharray="6 4"/>
                      <circle cx="50" cy="320" r="6" fill="#16a34a"/>
                      <circle id="dot" cx="130" cy="280" r="9" fill="#ef4444" stroke="#fff" stroke-width="3"/>
                      <circle cx="130" cy="280" r="14" fill="#ef4444" opacity="0.25" class="ping"/>
                      <circle cx="560" cy="80" r="6" fill="#0f766e"/>
                      <text x="568" y="76" font-size="11" font-weight="600" fill="#0f172a">Park</text>
                    </svg>
                    <div class="map-legend">
                      <div class="map-legend-item"><span class="map-legend-dot" style="background:#ef4444"></span> Live position</div>
                      <div class="map-legend-item"><span class="map-legend-dot" style="background:#16a34a"></span> Walked path</div>
                      <div class="map-legend-item"><span class="map-legend-dot" style="background:#0f766e"></span> Destination</div>
                    </div>
                  </div>
                </div>
              </div>

              <div class="space-y-4">
                <div class="card card-soft">
                  <div class="card-header"><h3 class="text-lg font-semibold">Milestones</h3></div>
                  <div class="card-content">
                    <div class="milestone-list" id="milestones"></div>
                  </div>
                </div>

                <div class="card card-soft">
                  <div class="card-header"><h3 class="text-lg font-semibold">Send Update to Owner</h3></div>
                  <div class="card-content space-y-3">
                    <div class="chip-group">
                      <button class="chip" data-tpl="Out the door — Bella is excited!">Heading out</button>
                      <button class="chip" data-tpl="Bella did her business 🎉">Potty done</button>
                      <button class="chip" data-tpl="At the park — playing fetch">At park</button>
                      <button class="chip" data-tpl="On our way back — be home in 15 min">Heading back</button>
                    </div>
                    <textarea class="textarea" id="msg" placeholder="Or write a custom message..."></textarea>
                    <button class="btn btn-primary w-full" id="send"><i data-lucide="send" class="i-4"></i> Send Update</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="footer-slot"></div>
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>window.PetWellPage = { id: "provider-tracker" };</script>
    <script src="/js/data.js"></script>
    <script src="/js/vet-data.js"></script>
    <script src="/js/provider-data.js"></script>
    <script src="/js/notif-data.js"></script>
    <script src="/js/shell.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const session = window.ProviderData.getActiveSession();
        document.getElementById("title").textContent = `Active Session — ${session.petName}`;
        document.getElementById("subtitle").textContent = `${session.service} · Started ${session.startedAt}`;

        const renderMilestones = (state) => {
          document.getElementById("milestones").innerHTML = state.map(m => `
            <div class="milestone ${m.done ? 'done' : ''}" data-id="${m.id}">
              <div class="milestone-icon"><i data-lucide="${m.icon}" class="i-5"></i></div>
              <div>
                <strong style="font-size: 0.875rem;">${m.label}</strong>
                <div class="text-xs text-muted-foreground">${m.done ? 'Logged at ' + m.time : 'Tap to log'}</div>
              </div>
              <span class="milestone-time">${m.time}</span>
            </div>
          `).join("");
          if (window.renderIcons) window.renderIcons();
        };
        renderMilestones(session.milestones);
        document.getElementById("milestones").addEventListener("click", (e) => {
          const m = e.target.closest(".milestone");
          if (!m) return;
          const id = m.dataset.id;
          const target = session.milestones.find(x => x.id === id);
          if (target && !target.done) {
            target.done = true;
            target.time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            renderMilestones(session.milestones);
            window.showToast(target.label + " logged");
          }
        });

        // Timer
        let elapsed = session.elapsed * 60;
        const timerEl = document.getElementById("timer");
        const updateTimer = () => {
          const mm = String(Math.floor(elapsed / 60)).padStart(2, "0");
          const ss = String(elapsed % 60).padStart(2, "0");
          timerEl.innerHTML = `<i data-lucide="timer" class="i-4"></i> ${mm}:${ss}`;
          if (window.renderIcons) window.renderIcons();
        };
        updateTimer();
        const tick = setInterval(() => { elapsed += 1; updateTimer(); }, 1000);

        // Templates
        document.querySelectorAll("[data-tpl]").forEach(c => c.addEventListener("click", () => {
          document.getElementById("msg").value = c.dataset.tpl;
        }));
        document.getElementById("send").addEventListener("click", () => {
          const v = document.getElementById("msg").value.trim();
          if (!v) return window.showToast("Enter a message first");
          window.showToast("Sent to owner", v);
          document.getElementById("msg").value = "";
        });
        document.getElementById("end-btn").addEventListener("click", () => {
          clearInterval(tick);
          window.showToast("Session ended", "Owner is notified and payment will release.");
        });
      });
    </script>
  </body>
</html>
