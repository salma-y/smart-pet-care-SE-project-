<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — PetWell</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body style="background: hsl(40 40% 92% / 0.3);">
    <div class="app-shell" style="align-items:center; justify-content:center; padding: 1rem;">
      <a href="index.html" class="brand mb-8" style="margin-top:2rem;">
        <div class="brand-logo" style="width:2.5rem; height:2.5rem; font-size:1.125rem;">PW</div>
        <span class="text-2xl font-bold tracking-tight text-primary">PetWell</span>
      </a>

      <div class="card shadow-lg w-full" style="max-width:28rem; border:0; border-radius:1rem;">
        <div class="card-header text-center" style="padding: 2rem 1.5rem 0.5rem;">
          <h2 class="text-2xl">Welcome back</h2>
          <p class="card-description">Enter your credentials to access your account</p>
        </div>
        <div class="card-content space-y-4" style="padding: 0 1.5rem 1rem;">
          <form id="login-form" class="space-y-4">
            <div>
              <label class="label" for="email">Email</label>
              <input class="input input-soft" id="email" name="email" type="email" placeholder="jane@example.com" required />
            </div>
            <div>
              <div class="flex items-center justify-between" style="margin-bottom: 0.5rem;">
                <label class="label" for="password" style="margin:0;">Password</label>
                <a href="forgot-password.html" class="text-sm font-medium text-primary">Forgot password?</a>
              </div>
              <input class="input input-soft" id="password" name="password" type="password" required />
            </div>
            <button type="submit" class="btn btn-primary btn-h12 w-full" style="border-radius: 0.75rem; margin-top: 0.5rem;">Sign In</button>
          </form>

          <div class="relative" style="margin: 1.5rem 0;">
            <div style="position:absolute; inset:0; display:flex; align-items:center;">
              <span style="width:100%; border-top:1px solid var(--border);"></span>
            </div>
            <div class="relative flex justify-center text-xs uppercase">
              <span style="background: var(--card); padding: 0 0.5rem; color: var(--muted-foreground);">Or continue with</span>
            </div>
          </div>

          <div class="grid" style="grid-template-columns: repeat(3, 1fr); gap: 0.75rem;">
            <button type="button" class="btn btn-outline btn-h12" style="border-radius: 0.75rem;" onclick="document.getElementById('login-form').dispatchEvent(new Event('submit'))">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            </button>
            <button type="button" class="btn btn-outline btn-h12" style="border-radius: 0.75rem;" onclick="document.getElementById('login-form').dispatchEvent(new Event('submit'))">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
            </button>
            <button type="button" class="btn btn-outline btn-h12" style="border-radius: 0.75rem;" onclick="document.getElementById('login-form').dispatchEvent(new Event('submit'))">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2"><path d="M9.101 23.691v-7.98H6.627v-3.667h2.474v-1.58c0-4.085 1.848-5.978 5.858-5.978.401 0 .955.042 1.468.103a8.68 8.68 0 0 1 1.141.195v3.325a8.623 8.623 0 0 0-.653-.036 26.805 26.805 0 0 0-.733-.009c-.707 0-1.259.096-1.675.309a1.686 1.686 0 0 0-.679.622c-.258.42-.374.995-.374 1.752v1.297h3.919l-.386 2.103-.287 1.564h-3.246v8.245C19.396 23.238 24 18.179 24 12.044c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.628 3.874 10.35 9.101 11.647Z"/></svg>
            </button>
          </div>
        </div>
        <div class="card-footer text-center" style="padding-bottom: 2rem;">
          <p class="text-sm text-muted-foreground">Don't have an account? <a href="register.html" class="font-semibold text-primary">Sign up</a></p>
        </div>
      </div>
    </div>

    <script>
      document.getElementById('login-form').addEventListener('submit', function (e) {
        e.preventDefault();
        window.location.href = "dashboard.html";
      });
    </script>
  </body>
</html>
