<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Symptom Checker — PetWell</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <div id="topnav-slot"></div>
      <div class="main-area">
        <div id="sidebar-slot"></div>
        <div class="page-content">
          <div class="p-6 md:p-8 mx-auto space-y-8" style="max-width: 48rem; width: 100%;">
            <div class="text-center mb-10">
              <div class="quick-action-icon bg-primary-tint mx-auto mb-4" style="width:4rem; height:4rem; border-radius:1rem;">
                <i data-lucide="stethoscope" class="i-8 text-primary"></i>
              </div>
              <h1 class="text-3xl tracking-tight mb-2">Symptom Checker</h1>
              <p class="text-muted-foreground max-w-xl mx-auto">
                Answer a few questions to get guidance on the urgency of your pet's symptoms and who they should see.
              </p>
            </div>

            <div class="card border-2 relative overflow-hidden" id="checker-root">
              <div class="progress-track">
                <div class="progress-bar" id="progress-bar" style="width: 33.33%;"></div>
              </div>
              <div class="card-content" style="padding: 2rem;" id="step-content"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="footer-slot"></div>
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>window.PetWellPage = { id: "symptom-checker" };</script>
    <script src="/js/data.js"></script>
    <script src="/js/shell.js"></script>
    <script src="/js/symptom-checker.js"></script>
  </body>
</html>
