kind = "web"
previewPath = "/"
title = "Smart Pet Care & Veterinary Management System"
version = "1.0.0"
id = "artifacts/petcare"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5000

[services.development]
run = "pnpm --filter @workspace/petcare run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/petcare", "run", "build" ]
publicDir = "artifacts/petcare/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5000"
BASE_PATH = "/"
