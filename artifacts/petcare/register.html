<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account — PetWell</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body style="background: hsl(40 40% 92% / 0.3);">
    <div class="app-shell" style="align-items:center; padding: 3rem 1rem;">
      <a href="index.html" class="brand mb-8">
        <div class="brand-logo" style="width:2.5rem; height:2.5rem; font-size:1.125rem;">PW</div>
        <span class="text-2xl font-bold tracking-tight text-primary">PetWell</span>
      </a>

      <div class="card shadow-lg w-full" style="max-width:32rem; border:0; border-radius:1rem;">
        <div class="card-header text-center" style="padding: 2rem 1.5rem 0.5rem;">
          <h2 class="text-2xl">Create an account</h2>
          <p class="card-description">Join PetWell to manage your pet's health</p>
        </div>
        <div class="card-content space-y-6">
          <div>
            <label class="label">I am a...</label>
            <div class="grid sm:grid-cols-3 gap-3" id="role-grid">
              <button type="button" class="radio-card" data-role="owner">
                <i data-lucide="heart" class="i-6 mb-2"></i>
                <span class="text-sm font-medium">Pet Owner</span>
              </button>
              <button type="button" class="radio-card" data-role="pro">
                <i data-lucide="shield" class="i-6 mb-2"></i>
                <span class="text-sm font-medium">Veterinarian</span>
              </button>
              <button type="button" class="radio-card" data-role="service">
                <i data-lucide="store" class="i-6 mb-2"></i>
                <span class="text-sm font-medium">Service Provider</span>
              </button>
            </div>
          </div>

          <form id="register-form" class="space-y-4">
            <div class="grid sm:grid-cols-2 gap-4">
              <div>
                <label class="label" for="firstName">First name</label>
                <input class="input input-soft" id="firstName" required />
              </div>
              <div>
                <label class="label" for="lastName">Last name</label>
                <input class="input input-soft" id="lastName" required />
              </div>
            </div>
            <div>
              <label class="label" for="email">Email</label>
              <input class="input input-soft" id="email" type="email" placeholder="jane@example.com" required />
            </div>
            <div>
              <label class="label" for="password">Password</label>
              <input class="input input-soft" id="password" type="password" required />
            </div>
            <button type="submit" id="register-btn" class="btn btn-primary btn-h12 w-full" style="border-radius: 0.75rem; margin-top: 0.5rem;">Create Account</button>
          </form>
        </div>
        <div class="card-footer text-center" style="padding-bottom: 2rem;">
          <p class="text-sm text-muted-foreground">Already have an account? <a href="login.html" class="font-semibold text-primary">Sign in</a></p>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>
      lucide.createIcons();

      let role = "owner";
      const params = new URLSearchParams(window.location.search);
      const r = params.get("role");
      if (r === "pro" || r === "service") role = r;

      const grid = document.getElementById("role-grid");
      const btn = document.getElementById("register-btn");
      function applyRole() {
        grid.querySelectorAll(".radio-card").forEach((c) => {
          c.classList.remove("selected", "blue", "orange");
          if (c.dataset.role === role) {
            c.classList.add("selected");
            if (role === "pro") c.classList.add("blue");
            if (role === "service") c.classList.add("orange");
          }
        });
        btn.style.background = role === "pro" ? "#2563eb" : role === "service" ? "#ea580c" : "";
      }
      grid.addEventListener("click", (e) => {
        const b = e.target.closest("[data-role]");
        if (!b) return;
        role = b.dataset.role;
        applyRole();
      });
      applyRole();

      document.getElementById("register-form").addEventListener("submit", (e) => {
        e.preventDefault();
        window.location.href = role === "owner" ? "dashboard.html" : "coming-soon.html";
      });
    </script>
  </body>
</html>
