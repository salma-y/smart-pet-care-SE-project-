<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Prescription — PetWell Vet</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <div id="topnav-slot"></div>
      <div class="main-area">
        <div id="sidebar-slot"></div>
        <div class="page-content">
          <div class="p-6 md:p-8 mx-auto space-y-6" style="max-width: 64rem; width: 100%;">

            <div class="page-header">
              <div>
                <h1>Issue Prescription</h1>
                <p>Function #2 — Drug-interaction checking is enabled.</p>
              </div>
              <a href="vet-dashboard.html" class="btn btn-ghost btn-sm"><i data-lucide="arrow-left" class="i-4"></i> Back</a>
            </div>

            <div class="grid" style="grid-template-columns: 1fr; gap: 1.5rem;">
              <div class="card card-soft">
                <div class="card-header pb-2"><h3 class="text-lg font-semibold">Patient & Medication</h3></div>
                <div class="card-content space-y-4">
                  <div>
                    <label class="label" for="patient-select">Patient</label>
                    <select id="patient-select" class="select"></select>
                  </div>

                  <div class="grid sm:grid-cols-2 gap-4">
                    <div>
                      <label class="label">Drug name</label>
                      <div class="autocomplete" id="drug-ac">
                        <input class="input" id="drug-input" placeholder="Start typing — e.g. 'Apoq...'" autocomplete="off" />
                        <div class="autocomplete-list" id="drug-list"></div>
                      </div>
                    </div>
                    <div>
                      <label class="label">Strength</label>
                      <input class="input" placeholder="e.g. 16 mg" />
                    </div>
                    <div>
                      <label class="label">Dosage</label>
                      <input class="input" id="dose" placeholder="e.g. 1 tablet" value="1 tablet" />
                    </div>
                    <div>
                      <label class="label">Frequency</label>
                      <select class="select" id="freq">
                        <option>Once daily</option>
                        <option>Twice daily</option>
                        <option>Every 12 hours</option>
                        <option>As needed</option>
                      </select>
                    </div>
                    <div>
                      <label class="label">Duration</label>
                      <select class="select" id="duration">
                        <option>7 days</option>
                        <option>14 days</option>
                        <option>30 days</option>
                        <option>Ongoing</option>
                      </select>
                    </div>
                    <div>
                      <label class="label">Refills</label>
                      <select class="select" id="refills">
                        <option>0</option>
                        <option>1</option>
                        <option>3</option>
                        <option>5</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label class="checkbox-row" style="cursor:pointer;">
                      <input type="checkbox" id="link-marketplace" checked />
                      <span class="text-sm">Link to Marketplace for therapeutic-diet ordering — Function #13</span>
                    </label>
                  </div>
                </div>
              </div>

              <!-- Drug interaction warning -->
              <div id="warning-slot"></div>

              <!-- Preview -->
              <div class="card card-soft">
                <div class="card-header pb-2"><h3 class="text-lg font-semibold">Prescription Preview</h3></div>
                <div class="card-content">
                  <div class="card" style="border:1px dashed var(--border);padding:1.25rem;background:hsl(40 40% 92% / 0.2);">
                    <div class="flex items-center justify-between mb-3">
                      <strong class="text-base">PetWell Veterinary Rx</strong>
                      <span class="text-xs text-muted-foreground" id="rx-date"></span>
                    </div>
                    <div class="space-y-2 text-sm" id="rx-preview"></div>
                  </div>
                  <div class="flex justify-end gap-2" style="margin-top:1rem;">
                    <button class="btn btn-outline btn-sm" id="save-draft">Save Draft</button>
                    <button class="btn btn-primary" id="issue-rx"><i data-lucide="check-circle-2" class="i-4"></i> Issue Prescription</button>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
      <div id="footer-slot"></div>
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>window.PetWellPage = { id: "vet-prescription" };</script>
    <script src="/js/data.js"></script>
    <script src="/js/vet-data.js"></script>
    <script src="/js/shell.js"></script>
    <script src="/js/vet-prescription.js"></script>
  </body>
</html>
